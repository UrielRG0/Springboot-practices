security:
  user:
    name: buzz
    password: infinity

taco:
  orders:
    pageSize: 10
  discount:
    codes:
      abcdef: 10

tacos:
  discount:
    codes:
      TACO10:
        type: PERCENTAGE
        value: 10.00
        min-purchase: 20.00
        max-discount: 50.00
        start-date: "2026-01-01"
        end-date: "2026-12-31"
      FESTIVAL50:
        type: FIXED
        value: 50.00
        min-purchase: 100.00
        start-date: "2026-09-01"
        end-date: "2026-09-30"

tacocloud:
  messaging:
    transport: noop
    destination:
      orders: tacocloud.orders.queue

spring:
  application:
    name: taco-cloud
  data:
    rest:
      base-path: /data-api
    cassandra:
      keyspace-name: tacocloud
  boot:
    admin:
      client:
        url: http://localhost:9090
        username: admin
        password: 53cr3t

  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
        default-requeue-rejected: false

  kafka:
    bootstrap-servers:
    - localhost:9092
    template:
      default-topic: tacocloud.orders.topic
    producer:
      keySerializer: org.springframework.kafka.support.serializer.JsonSerializer
      valueSerializer: org.springframework.kafka.support.serializer.JsonSerializer
  jmx:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
        exclude: threaddump,heapdump
  endpoint:
    health:
      show-details: always
  info:
    git:
      mode: full

info:
  contact:
    email: support@tacocloud.com
    phone: 822-625-6831

logging:
  level:
    tacos: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [corrId=%X{correlationId}] - %msg%n"

---
spring:
  profiles: prod
  datasource:
    url: jdbc:mysql://localhost/tacocloud
    username: tacouser
    password: tacopassword

logging:
  level:
    tacos: WARN