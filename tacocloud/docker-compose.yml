version: '3.8'

services:
  mongo:
    image: mongo:4.4.2
    container_name: tacocloud-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tacocloud-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped